<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerShell Help Guide</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f8f9fa; }
        h1, h2, h3, h4 { color: #2c3e50; }
        a { color: #3498db; text-decoration: none; }
        a:hover { text-decoration: underline; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; border: 1px solid #ddd; }
        code { background: #f4f4f4; padding: 2px 5px; border-radius: 3px; }
        blockquote { border-left: 4px solid #3498db; padding-left: 15px; color: #555; margin: 20px 0; font-style: italic; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .nav-bar { background: #34495e; color: white; padding: 15px 20px; border-radius: 5px; margin-bottom: 20px; }
        .nav-bar a { color: white; margin-right: 15px; font-weight: bold; }
        .nav-bar a:hover { text-decoration: underline; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; font-weight: bold; margin-left: 8px; }
        .badge.tip { background: #9b59b6; color: white; }
        .badge.warning { background: #e67e22; color: white; }
        .badge.info { background: #3498db; color: white; }
        .badge.success { background: #27ae60; color: white; }
        .toc { background: #ecf0f1; padding: 15px; border-radius: 5px; margin: 20px 0; }
        .toc h3 { margin-top: 0; }
        .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; text-align: center; font-size: 0.9em; color: #7f8c8d; }
        .highlight { background: #fff3cd; padding: 2px 4px; border-radius: 3px; }
        .highlight-box { background: #e8f4f8; border-left: 4px solid #3498db; padding: 15px; margin: 20px 0; }
        .visitor-counter { text-align: right; margin-top: 10px; font-size: 0.85em; color: #7f8c8d; }
        .visitor-counter span { font-weight: bold; color: #3498db; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="https://jazblue.github.io/tech-resources/">← Tech Resources Hub</a>
        <a href="https://jazblue.github.io/cve-2026/">CVE Analysis</a>
        <a href="https://jazblue.github.io/common-home-pc-fixes/">Common Home PC Fixes</a>
    </div>

    <div id="content">Loading...</div>

    <div class="visitor-counter">
        Visits: <span id="visit-count">Loading...</span>
    </div>

    <div class="footer">
        <p>PowerShell Help Guide &mdash; Essential commands and scripts for Windows administration.</p>
        <p>Last updated: October 2026</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        fetch('index.md')
            .then(response => response.text())
            .then(text => {
                const html = marked.parse(text);
                document.getElementById('content').innerHTML = html;
                
                // Add syntax highlighting to code blocks
                document.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            })
            .catch(err => {
                document.getElementById('content').innerHTML = '<p>Error loading content: ' + err.message + '</p>';
            });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/common.js"></script>
    <script>hljs.highlightAll();</script>
    
    <!-- Visitor Counter -->
    <script>
        // Simple visitor counter using a free API
        async function updateVisitorCount() {
            try {
                // Use a simple free counter service
                const response = await fetch('https://api.countapi.xyz/hit/jazblue-powershell/visits');
                const data = await response.json();
                document.getElementById('visit-count').textContent = data.value.toLocaleString();
            } catch (error) {
                document.getElementById('visit-count').textContent = 'N/A';
                console.log('Counter unavailable:', error);
            }
        }
        updateVisitorCount();
    </script>
</body>
</html>
